<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - PhoneBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/x-icon" href="img/icon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="about.html">
                <i class="bi bi-person-lines-fill me-2"></i>PhoneBook
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Contacts</a></li>
                    <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 text-center">
                        <h3 class="mb-0 fw-bold">User Profile</h3>
                    </div>
                    <div class="card-body p-4">
                        <table class="table table-borderless">
                            <tbody>
                                <tr class="border-bottom">
                                    <td class="fw-bold text-secondary" style="width: 40%;">Full Name</td>
                                    <td id="profile-name">Loading...</td>
                                </tr>
                                <tr class="border-bottom">
                                    <td class="fw-bold text-secondary">Email Address</td>
                                    <td id="profile-email">Loading...</td>
                                </tr>
                                <tr class="border-bottom">
                                    <td class="fw-bold text-secondary">Gender</td>
                                    <td id="profile-gender">Loading...</td>
                                </tr>
                                <tr>
                                    <td class="fw-bold text-secondary">Date of Birth</td>
                                    <td id="profile-dob">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="text-center mt-4">
                            <button class="btn btn-outline-danger btn-sm" id="logout-btn">
                                <i class="bi bi-box-arrow-right me-2"></i>Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer mt-auto py-3 text-center text-muted small border-top bg-white">
        <div class="container">
            &copy; 2026 Laboratory Work №2. Developed by Shcherbatiuk Yevhen, KV-33. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
